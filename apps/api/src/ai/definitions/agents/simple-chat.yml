# 最简示例：单 chat 节点（无工具）+ 会话型输入契约（ADR-006 D5）
# 会话模式请求体：{ sessionId, input: { message } }——历史自动注入
name: simple-chat
description: 通用对话助手——支持多轮会话，直接回答输入的问题，不调用工具
icon: RobotOutlined
audience: all # 用户端可见（缺省 admin，显式开放）
triggers:
  http:
    enabled: true
workflow:
  - id: answer
    type: chat
    prompt: |
      {{input.message}}
output:
  template: '{{nodes.answer.output}}'
